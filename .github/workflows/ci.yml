name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: lint-pip-
      - run: pip install ruff
      - run: ruff check domino/ tests/
      - run: ruff format --check domino/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: typecheck-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: typecheck-pip-
      - run: pip install -e ".[dev]"
      - run: mypy domino/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: test-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: test-pip-${{ matrix.python-version }}-
      - run: pip install -e ".[dev]"
      - run: pytest --cov=domino --cov-report=term-missing --junitxml=results.xml tests/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: results.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: security-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: security-pip-
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -r domino/ -q
      # ignore pip-itself CVEs (CVE-2026-3219 has no fix; CVE-2026-6357 fixed in pip 26.1
      # but the runner image lags); audit project deps, not the build tool
      - run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357
